name: Fetch Sports Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Data from RapidAPI
        env:
          API_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          curl --request GET \
            --url 'https://cricbuzz-cricket.p.rapidapi.com/mcenter/v1/41881/overs' \
            --header "Content-Type: application/json" \
            --header "x-rapidapi-host: cricbuzz-cricket.p.rapidapi.com" \
            --header "x-rapidapi-key: $API_KEY" \
            --output data.json

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update sports data" || exit 0
          git push
