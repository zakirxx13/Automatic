name: Fetch Jamuna TV Stream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-jamuna-stream:

    runs-on: ubuntu-latest

    steps:

      # ==========================
      # 1. Checkout Repository
      # ==========================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ==========================
      # 2. Fetch Jamuna TV M3U8
      # ==========================
      - name: Fetch Jamuna TV Playlist
        run: |

          set -e

          STREAM_URL="https://bldcmprod-cdn.toffeelive.com/cdn/live/jamuna_tv/playlist.m3u8"

          USER_AGENT="okhttp/4.11.0"

          echo "======================================"
          echo "Fetching Jamuna TV M3U8"
          echo "======================================"

          rm -f jamuna_tv.m3u8

          HTTP_CODE=$(curl \
            -L \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 60 \
            -A "$USER_AGENT" \
            -o jamuna_tv.m3u8 \
            -w "%{http_code}" \
            "$STREAM_URL")

          echo ""
          echo "HTTP Status: $HTTP_CODE"

          # ==========================
          # Check HTTP Status
          # ==========================

          if [ "$HTTP_CODE" != "200" ]; then

            echo ""
            echo "ERROR: Failed to download playlist."
            echo "HTTP Status: $HTTP_CODE"

            exit 1

          fi

          # ==========================
          # Check File
          # ==========================

          if [ ! -f jamuna_tv.m3u8 ]; then

            echo "ERROR: jamuna_tv.m3u8 was not created."

            exit 1

          fi

          if [ ! -s jamuna_tv.m3u8 ]; then

            echo "ERROR: jamuna_tv.m3u8 is empty."

            exit 1

          fi

          echo ""
          echo "Playlist downloaded successfully."

          echo ""
          echo "File information:"
          ls -lh jamuna_tv.m3u8

          # ==========================
          # Validate M3U8
          # ==========================

          echo ""
          echo "Checking M3U8 format..."

          if grep -q "#EXTM3U" jamuna_tv.m3u8; then

            echo "Valid M3U8 playlist."

          else

            echo "WARNING: #EXTM3U not found."

            echo ""
            echo "First 20 lines:"
            head -n 20 jamuna_tv.m3u8

            exit 1

          fi

          # ==========================
          # Preview
          # ==========================

          echo ""
          echo "Playlist preview:"
          head -n 10 jamuna_tv.m3u8

      # ==========================
      # 3. Commit Changes
      # ==========================
      - name: Commit Updated Playlist
        run: |

          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jamuna_tv.m3u8

          if git diff --cached --quiet; then

            echo "No changes detected."

            exit 0

          fi

          git commit -m "Auto-update Jamuna TV playlist"

          git push

          echo ""
          echo "======================================"
          echo "Playlist updated successfully."
          echo "======================================"
