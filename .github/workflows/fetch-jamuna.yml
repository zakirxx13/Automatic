name: Fetch Jamuna TV Stream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-jamuna-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Fetch M3U8 Playlist
        run: |
          set -e

          STREAM_URL="https://YOUR-AUTHORIZED-DOMAIN/example/playlist.m3u8"
          USER_AGENT="okhttp/4.11.0"

          echo "Fetching playlist..."

          HTTP_CODE=$(curl -L \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 60 \
            -A "$USER_AGENT" \
            -o jamuna_tv.m3u8 \
            -w "%{http_code}" \
            "$STREAM_URL")

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Request failed."
            exit 1
          fi

          if [ ! -s jamuna_tv.m3u8 ]; then
            echo "ERROR: Playlist is empty."
            exit 1
          fi

          echo "Playlist downloaded successfully."

          head -n 5 jamuna_tv.m3u8

      - name: Validate M3U8
        run: |
          if grep -q "#EXTM3U" jamuna_tv.m3u8; then
            echo "Valid M3U8 detected."
          else
            echo "Invalid M3U8 response."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jamuna_tv.m3u8

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Auto-update stream"
          git push
